name: Python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lock:
    runs-on: [self-hosted, jerco-public, linode]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - run: uv lock --check

  ruff:
    runs-on: [self-hosted, jerco-public, linode]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  mypy:
    runs-on: [self-hosted, jerco-public, linode]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: uv run --frozen mypy strix/

  bandit:
    runs-on: [self-hosted, jerco-public, linode]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: uv run --frozen bandit -r strix/ -c pyproject.toml

  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: [self-hosted, jerco-public, linode]
    timeout-minutes: 30
    env:
      # Use LiteLLM's bundled price map instead of fetching the live one from GitHub at
      # import time. The live map now has a unique `github_copilot/claude-sonnet-4.6`
      # entry, so cost estimation in tests/test_tool_call_ids_providers.py resolves
      # `openrouter/anthropic/claude-sonnet-4.6` to the Copilot provider. LiteLLM then
      # starts an interactive GitHub device login and the job hangs (same on upstream
      # GitHub-hosted CI). The bundled map keeps tests deterministic and offline.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --frozen pytest -q
